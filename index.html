<!doctype html>
<html lang="fa"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B3FA8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر کیف"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>دفتر کیف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: phone = bottom tab bar, desktop = right-hand rail. Ink-blue for sales, brass for purchases and cheques. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#EBEDF4; --line:#DADEEA;
  --ink:#151A2D; --muted:#586080;
  --accent:#2B3FA8; --accent-ink:#FFFFFF; --accent-soft:#E2E6FA;
  --brass:#8F5F12; --brass-soft:#F4E8D0;
  --good:#17744A; --good-soft:#DCF1E5;
  --bad:#B3261E; --bad-soft:#F8E0DE;
  --warn:#855400; --warn-soft:#FAEAC6;
  --scrim:rgba(14,18,34,.5);
  --font:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C101C; --surface:#151B2D; --surface-2:#1C2338; --line:#2A3350;
    --ink:#E8EBF6; --muted:#9AA2BF;
    --accent:#8FA2FF; --accent-ink:#0C101C; --accent-soft:#222C63;
    --brass:#E0B060; --brass-soft:#3A2E14;
    --good:#5ED39B; --good-soft:#12301F;
    --bad:#FF8A80; --bad-soft:#3A1613;
    --warn:#F2C265; --warn-soft:#3A2C0C;
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C101C; --surface:#151B2D; --surface-2:#1C2338; --line:#2A3350;
  --ink:#E8EBF6; --muted:#9AA2BF;
  --accent:#8FA2FF; --accent-ink:#0C101C; --accent-soft:#222C63;
  --brass:#E0B060; --brass-soft:#3A2E14;
  --good:#5ED39B; --good-soft:#12301F;
  --bad:#FF8A80; --bad-soft:#3A1613;
  --warn:#F2C265; --warn-soft:#3A2C0C;
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.7; direction:rtl;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:800;line-height:1.4;text-wrap:balance}
h2{font-size:16px;font-weight:700;line-height:1.5;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}

/* shell */
.shell{display:block}
.nav{
  position:fixed;inset-inline:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
  background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));
  padding-right:max(8px,env(safe-area-inset-right,0px));
}
.nav a{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;
  color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500;min-width:0;
}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.main{min-width:0;padding-bottom:96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;color:var(--accent);flex:none}
.brand b{font-size:18px;font-weight:800;display:block;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted);display:block}
.rail-brand{display:none}
@media (min-width:880px){
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto}
  .nav{
    position:sticky;top:16px;align-self:start;inset-inline:auto;grid-template-columns:1fr;gap:4px;
    border:1px solid var(--line);border-radius:18px;padding:12px;
  }
  .nav a{flex-direction:row;gap:12px;padding:10px 12px;font-size:14.5px}
  .main{padding-bottom:32px}
  .top{display:none}
  .rail-brand{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .rail-brand svg{width:34px;height:34px;color:var(--accent)}
  .rail-brand b{font-size:18px;font-weight:800;display:block;line-height:1.2}
  .rail-brand span{font-size:12px;color:var(--muted);display:block}
}

/* page pieces */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools input[type=search]{flex:1 1 180px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;min-width:0}
.card>h2{margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.stat-l{font-size:13px;color:var(--muted)}
.stat-v{font-size:clamp(17px,4.8vw,22px);font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.4}
.stat-v.acc{color:var(--accent)} .stat-v.brs{color:var(--brass)}
.unit{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:880px){.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:42px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 12px;min-height:34px;font-size:13.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible,.row:focus-visible,.icon-btn:focus-visible,.fbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{appearance:none;border:0;background:var(--surface-2);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:20px;line-height:1;flex:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* filter chips */
.fseg{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13.5px;cursor:pointer;min-height:34px}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* inputs */
input,select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;
}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px;min-width:0}
.field>label,.lab{font-size:13px;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:420px){.row2.wrap{grid-template-columns:minmax(0,1fr)}}
.inline{display:flex;gap:8px;align-items:center}
.err{color:var(--bad);font-size:13px;min-height:0}
.err:empty{display:none}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg label{flex:1;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0}
.seg span{display:block;text-align:center;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px}
.seg input:checked+span{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{
  appearance:none;width:100%;text-align:start;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;
}
.row:hover{background:var(--surface-2)}
.r-main{display:flex;flex-direction:column;min-width:0;gap:1px}
.r-main b{font-weight:700;overflow-wrap:anywhere}
.r-amt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;text-align:end}
.list.plain{gap:0}
.list.plain .row{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px}
.list.plain .row:last-child{border-bottom:0}
.empty{padding:22px 12px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;line-height:1.7;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.brs{background:var(--brass-soft);color:var(--brass)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.in{color:var(--good)} .out{color:var(--ink)}

/* chart */
.chart{width:100%;height:auto;display:block;font-family:var(--font)}
.chart text{fill:var(--muted);font-size:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}

/* report bars */
.hbar{display:flex;flex-direction:column;gap:10px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hb-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:4px}
.hb-track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb-track.brs i{background:var(--brass)}

/* tables */
.tblwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:13.5px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:12.5px}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.wrapt{white-space:normal;min-width:120px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--bg);width:min(680px,100%);max-height:94%;overflow:auto;border-radius:20px 20px 0 0;
  padding-top:18px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
@media (min-width:880px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%;padding-inline:24px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 4px;font-size:14px}
.kv span b{font-weight:700}
.sum{display:flex;flex-direction:column;justify-content:flex-end;gap:0;padding-bottom:6px;min-width:0}
.sum span{font-size:13px;color:var(--muted)}
.sum b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.totals{margin-top:12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .grand{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.it{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;padding:12px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;align-items:center}
.it .it-d{grid-column:1 / -1}
.it .it-t{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.bal-big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.4}

/* misc */
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 14px;margin-bottom:14px;font-size:14px}
.banner:empty{display:none}
.toast{
  position:fixed;z-index:60;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);
  opacity:0;pointer-events:none;transition:opacity .15s;
}
.toast.show{opacity:1}
@media (min-width:880px){.toast{bottom:28px}}
.skel{height:84px;border-radius:14px;background:var(--surface-2);margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}}
.hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.sect{margin-top:22px;margin-bottom:8px}

/* v2 additions */
.nav .xtra{display:none}
.nav .sl{display:inline} .nav .ll{display:none}
@media (max-width:879px){.nav{grid-template-columns:repeat(6,minmax(0,1fr))}.nav a{font-size:11px}}
@media (min-width:880px){.nav .xtra{display:flex}.nav .more{display:none}.nav .sl{display:none}.nav .ll{display:inline}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 8px;font-weight:700;font-size:14px;cursor:pointer;min-height:46px}
.tile:hover{background:var(--surface-2)}
.tile.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.daynav input{width:132px;text-align:center}
.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.three{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:720px){.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
button.stat{appearance:none;text-align:start;cursor:pointer;font:inherit;color:inherit}
button.stat:hover{background:var(--surface-2)}
button.stat.on{border-color:var(--accent);background:var(--accent-soft)}
button.stat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num.in{color:var(--good)}
.num.out{color:var(--bad)}
.it .it-nc{grid-column:1 / -1;font-size:13px;display:flex;gap:8px;align-items:center;color:var(--muted)}
.it .it-nc input{width:18px;min-height:18px;height:18px}
.more-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.more-list .btn{text-align:start;justify-content:flex-start}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-top:10px}
.lab2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cash-open{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.cash-open .field{flex:1 1 220px;margin-top:0}

.chart text{direction:ltr}
.sugg{grid-column:1 / -1;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:240px;overflow:auto;display:flex;flex-direction:column}
.sugg-h{font-size:12px;color:var(--muted);background:var(--surface-2);padding:4px 12px;font-weight:700}
.sugg-i{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:start;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.sugg-i:hover,.sugg-i:focus-visible{background:var(--accent-soft)}
.sugg-i:last-child{border-bottom:0}
.sugg-save{color:var(--accent);font-weight:700}
.sugg-e{padding:10px 12px;font-size:13px;color:var(--muted)}

.wk-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.wk .actions{margin-top:10px}
.bar{position:relative;height:10px;border-radius:99px;background:var(--surface-2);margin:8px 0 6px;overflow:visible}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--brass);text-decoration:none}
[hidden]{display:none!important}

.rrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr)) auto;gap:6px;align-items:center;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.rrow input,.rrow select{min-width:0}
.rrow .icon-btn{justify-self:end}
.mf .btn.small{margin-top:2px}

.wdchip{font-size:16px;font-weight:700;padding:6px 14px;border-radius:99px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.icon-btn.eye{color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
</style>
<div class="shell" id="app" dir="rtl" lang="fa">
  <nav class="nav" id="nav" aria-label="بخش‌های برنامه"></nav>
  <main class="main">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 12a6 6 0 0 1 12 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M5 12h22l-1.6 14a2 2 0 0 1-2 1.8H8.6a2 2 0 0 1-2-1.8z" fill="currentColor"/></svg>
        <div><b>دفتر کیف</b><span id="today"></span></div>
      </div>
    </header>
    <div class="banner" id="banner" role="status"></div>
    <div id="view"></div>
  </main>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Local storage layer: gives the app the same db/user/downloads API it uses in Claude, backed by IndexedDB. */
(function(){
  var COLS=['parties','invoices','entries','cheques','items','settings','stock','deliveries','models','orders'];
  var dbp=null,subs={},mem={};
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(function(res,rej){
      var r=indexedDB.open('daftar-kif',1);

  for(const s of S.stock)if(stockToBuyAll(s))o.buyAll.push({date:s.date,lab:'انبار: '+s.name+' از '+sname(s)+(s.invNo?' · فاکتور '+s.invNo:''),amt:stockAmount(s),act:'open-stock',id:s.id});
  return o;
}
/* sale invoice numbers: every party has its own series that starts in its own block (1001, 2001, 3001 ...). Past 9999 the numbers simply grow to 5 digits. */
function saleStart(id){
  const p=P(id);
  if(p&&+p.numBase)return +p.numBase;
  const a=S.invoices.filter(i=>i.type==='sale'&&i.partyId===id&&+i.no>0).map(i=>+i.no);
  return a.length?Math.floor((Math.min.apply(null,a)-1)/1000)*1000+1:null;
}
function nextBlockStart(){
  let m=0;
  S.parties.forEach(p=>{const s=saleStart(p.id);if(s)m=Math.max(m,Math.floor((s-1)/1000))});
  return(m+1)*1000+1;
}
function nextSaleNo(id,skipId){
  const p=P(id);
  const a=S.invoices.filter(i=>i.type==='sale'&&!i.ret&&i.partyId===id&&i.id!==skipId&&+i.no>0).map(i=>+i.no);
  if(a.length)return Math.max.apply(null,a)+1;
  if(p&&+p.numBase)return +p.numBase;
  return null;
}
const runEntries=()=>S.entries.filter(e=>e.type==='cash_purchase'&&e.cat==='running');
const inR=(d,r)=>d>=r.a&&d<r.b;
const sumAmt=(a,r)=>a.filter(e=>!r||inR(e.date,r)).reduce((s,e)=>s+e.amt,0);
const sumBags=(a,r)=>a.filter(e=>!r||inR(e.date,r)).reduce((s,e)=>s+(e.bags||0),0);

/* weekly stats: week = Saturday..Friday */
const cfgP=()=>S.settings.find(x=>x.id==='main')||{};
const weekStartOf=iso=>{const dow=dowOf(iso);return addDays(iso,-((dow+1)%7))};
function rateOf(p){
  const c=cfgP();
  if(p&&kindNorm(p.kind)!=='shop')return{rate:+p.rate||+c.wsRate||2000000};
  return{min:+(p&&p.rateMin)||+c.shopMin||2000000,max:+(p&&p.rateMax)||+c.shopMax||3000000};
}
function weekShop(id,a){
  const r={a:a,b:addDays(a,7)},rt=rateOf(P(id));
  let bags=0,cash=0,cashChq=0,otherChq=0,cashRecv=0;
  for(const i of S.invoices)if(i.partyId===id&&i.type==='sale'&&!i.ret&&invKind(i)==='bag'&&inR(i.date,r))bags+=invBags(i);
  for(const e of S.entries)if(e.partyId===id&&e.type==='cash_receipt'&&inR(e.date,r)){cash+=+e.amount;cashRecv+=+e.amount}
  for(const c of S.cheques)if(c.fromId===id&&c.status!=='bounced'&&inR(c.receivedDate,r)){if(c.isCash){cash+=+c.amount;cashChq+=+c.amount}else otherChq+=+c.amount}
  return{bags,cash,cashRecv,cashChq,otherChq,min:bags*rt.min,max:bags*rt.max,rt};
}
function weekWorkshop(id,a){
  const r={a:a,b:addDays(a,7)};
  let bags=0,owed=0,paid=0;
  for(const d of S.deliveries)if(d.partyId===id&&inR(d.date,r)){bags+=+d.bags||0;owed+=+d.amount||0}
  for(const i of S.invoices)if(i.partyId===id&&i.type==='purchase'&&!i.ret&&invKind(i)==='bag'&&inR(i.date,r)){const nb=invBags(i);bags+=nb;owed+=nb*rateOf(P(id)).rate}
  for(const e of S.entries)if(e.partyId===id&&e.type==='cash_payment'&&e.for==='workshop'&&inR(e.date,r))paid+=+e.amount;
  for(const c of S.cheques)if(c.toId===id&&c.passPurpose==='workshop'&&c.passedDate&&c.status!=='bounced'&&inR(c.passedDate,r))paid+=+c.amount;
  return{bags,owed,paid,left:owed-paid};
}
function shopState(w){
  if(!w.bags&&!w.cash)return{k:'none',t:'بدون دریافت',c:'neutral'};
  if(w.cash>=w.max&&w.max>0)return{k:'full',t:'کامل',c:'good'};
  if(w.cash>=w.min)return{k:'min',t:'در حد حداقل',c:'acc'};
  return{k:'low',t:'کمتر از حداقل',c:'bad'};
}
/* warehouse: a ticked line is posted to the 'account of' party and to total purchases (unless the linked invoice already does it) */
function sname(s){return s.fromName||(s.fromId?pname(s.fromId):'—')}
function stockInv(s){return s.invoiceId&&S.invoices.find(i=>i.id===s.invoiceId)||null}
function stockAmount(s){
  const inv=stockInv(s);
  if(inv){const L=(inv.items||[]).filter(x=>nm(x.d)===nm(s.name));if(L.length){const q=L.reduce((t,x)=>t+(+x.q||0),0),v=L.reduce((t,x)=>t+(+x.q||0)*(+x.p||0),0);if(q>0)return Math.round(v/q*(+s.qty))}}
  return(+s.price||0)*(+s.qty||0);
}
const stockToAccount=s=>{if(!s.matched||!(stockAmount(s)>0))return false;const inv=stockInv(s);return!inv||inv.partyId!==s.accountId};
const stockToBuyAll=s=>{if(!s.matched||!(stockAmount(s)>0))return false;const inv=stockInv(s);return!inv||inv.type==='sale'};
/* warehouse: compare a stock line with the invoice it was matched to */
const nm=x=>String(x||'').replace(/\s+/g,' ').trim();
function stockCheck(s){
  if(!s.matched)return{k:'open'};
  const inv=s.invoiceId&&S.invoices.find(i=>i.id===s.invoiceId);
  if(!inv)return{k:'nolink'};
  const L=(inv.items||[]).filter(x=>nm(x.d)===nm(s.name));
  if(!L.length)return{k:'noname'};
  const q=L.reduce((t,x)=>t+(+x.q||0),0);
  return q===+s.qty?{k:'ok',q}:{k:'diff',q};
}

let lastFocus=null;
function openSheet(title,body){
  closeSheet();
  lastFocus=document.activeElement;
  $('#sheetRoot').innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet-h"><h2>'+esc(title)+'</h2><button class="icon-btn" data-act="close" aria-label="بستن">×</button></div>'+body+'</div></div>';
  document.documentElement.style.overflow='hidden';
  $$('#sheetRoot [data-money]').forEach(moneyInput);
}
function closeSheet(){
  const r=$('#sheetRoot');if(!r.firstChild)return;
  r.innerHTML='';document.documentElement.style.overflow='';
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}
}
function moneyInput(el){
  el.addEventListener('input',()=>{
    const neg=el.hasAttribute('data-neg')&&/^\s*-/.test(toLat(el.value));
    const pos=el.selectionStart==null?el.value.length:el.selectionStart;
    const before=toLat(el.value.slice(0,pos)).replace(/[^\d.]/g,'').length;
    let c=toLat(el.value).replace(/[^\d.]/g,'');
    const d=c.indexOf('.');if(d>=0)c=c.slice(0,d+1)+c.slice(d+1).replace(/\./g,'');
    const parts=c.split('.');
    let ip=parts[0].replace(/^0+(?=\d)/,'');
    let out=ip.replace(/\B(?=(\d{3})+(?!\d))/g,'٬');
    if(parts.length>1)out+='٫'+parts[1];
    out=(neg?'-':'')+faD(out);el.value=out;
    let n=0,k=0;while(k<out.length&&n<before){if(/[۰-۹٫]/.test(out[k]))n++;k++}
    try{el.setSelectionRange(k,k)}catch(e){}
  });
}
const mval=n=>n?faD(String(Math.round(n*100)/100).replace(/\B(?=(\d{3})+(?!\d))/g,'٬')):'';

}

    S.cheques.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||'')).forEach(c=>rows.push([c.sayad||'',Math.round(c.amount),jlat(c.due),pname(c.fromId),c.toId?pname(c.toId):'',c.owner||'',CST[c.status]||'',c.isCash?'بله':'']));

function startTimer(){

  ui.todaySeen=t;

async function init(){
  buildNav();
  setHeaderDate();
  route();
  const cl=window.claude;
  let db=null;
  if(cl&&cl.use){try{db=await cl.use('db')}catch(e){db=null}}
  if(!db){S.local=true;loadLocal();setBanner('ذخیرهٔ ابری در دسترس نیست؛ داده‌ها فقط روی همین مرورگر می‌مانند.');render();return}
  S.db=db;
  try{const u=await cl.use('user');if(u&&u.can){const c=await u.can('data.write');if(c===false){S.canWrite=false;setBanner('فقط می‌توانی ببینی؛ اجازهٔ ثبت و ویرایش نداری.')}}}catch(e){}
  try{S.dl=await cl.use('downloads')}catch(e){S.dl=null}
  startTimer();
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      S.loaded[c]=true;
      if(!snap.metadata.fromCache&&S.timeout){S.timeout=false;if(S.canWrite)setBanner('')}
      sched();
    },err=>{S.loaded[c]=true;setBanner(err&&err.code==='revoked'?'دسترسی به داده‌ها لغو شد.':'خواندن داده‌ها ممکن نشد.');sched()});
  });
}

function shopRange(id,r){
  let bags=0,cash=0;const rt=rateOf(P(id));
  for(const i of S.invoices)if(i.partyId===id&&i.type==='sale'&&!i.ret&&invKind(i)==='bag'&&inR(i.date,r))bags+=invBags(i);
  for(const e of S.entries)if(e.partyId===id&&e.type==='cash_receipt'&&inR(e.date,r))cash+=+e.amount;
  for(const c of S.cheques)if(c.fromId===id&&c.isCash&&c.status!=='bounced'&&inR(c.receivedDate,r))cash+=+c.amount;
  return{bags,cash,min:bags*rt.min,max:bags*rt.max};
}
function wsRange(id,r){
  let bags=0,owed=0,paid=0;
  for(const d of S.deliveries)if(d.partyId===id&&inR(d.date,r)){bags+=+d.bags||0;owed+=+d.amount||0}
  for(const i of S.invoices)if(i.partyId===id&&i.type==='purchase'&&!i.ret&&invKind(i)==='bag'&&inR(i.date,r)){const nb=invBags(i);bags+=nb;owed+=nb*rateOf(P(id)).rate}
  for(const e of S.entries)if(e.partyId===id&&e.type==='cash_payment'&&e.for==='workshop'&&inR(e.date,r))paid+=+e.amount;
  for(const c of S.cheques)if(c.toId===id&&c.passPurpose==='workshop'&&c.passedDate&&c.status!=='bounced'&&inR(c.passedDate,r))paid+=+c.amount;
  return{bags,owed,paid};
}
function hb(rows,fmtv,cls){

  const mx=Math.max.apply(null,rows.map(r=>r.v).concat([1]));
  return'<div class="hbar">'+rows.map(r=>'<div><div class="hb-top"><span>'+esc(r.n)+'</span><span class="num">'+fmtv(r.v)+'</span></div><div class="hb-track '+(cls||'')+'"><i style="width:'+(r.v>0?Math.max(3,r.v/mx*100):0)+'%"></i></div></div>').join('')+'</div>';
}
function weeklyTrend(){
  const N=8,st=weekStartOf(todayISO()),shops=S.parties.filter(p=>kindNorm(p.kind)==='shop'),data=[];
  for(let k=N-1;k>=0;k--){
    const a=addDays(st,-7*k);let cash=0,min=0,bags=0;
    shops.forEach(p=>{const w=weekShop(p.id,a);cash+=w.cash;min+=w.min;bags+=w.bags});
    const j=iso2j(a);data.push({lab:faD(pad(j.jm)+'/'+pad(j.jd)),full:'هفتهٔ '+jfmt(a),cash,min,bags});
  }
  const max=niceMax(Math.max.apply(null,data.map(d=>Math.max(d.cash,d.min)).concat([0])));
  if(!max)return emptyBox('هنوز دریافتی یا فروش کیفی در این هفته‌ها نیست');
  const W=360,H=190,x0=6,x1=W-44,top=14,bot=H-28,slot=(x1-x0)/N,bw=Math.min(17,slot*.3),yv=v=>bot-(v/max)*(bot-top);
  let g='';
  [0,.5,1].forEach(f=>{const v=max*f,y=yv(v);g+='<line x1="'+x0+'" x2="'+x1+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(W-4)+'" y="'+(y+3.5)+'" text-anchor="end">'+faD(String(Math.round(v/1e6)))+'</text>'});
  data.forEach((d,k)=>{
    const cx=x1-(k+.5)*slot;
    const bar=(x,v,col,lab)=>v>0?'<rect x="'+x+'" y="'+yv(v)+'" width="'+bw+'" height="'+(bot-yv(v))+'" rx="3" fill="'+col+'"><title>'+lab+': '+fmt(v)+' ریال</title></rect>':'';
    g+=bar(cx+1,d.cash,'var(--accent)','پرداخت نقدی '+d.full)+bar(cx-bw-1,d.min,'var(--brass)','حداقل لازم '+d.full);

/* ---------- cost estimator ---------- */
const YD=0.9144;
function costModel(m){
  const waste=Math.max(0,+m.waste||0),mats=(m.mats||[]).map((x,i)=>{
    const area=(m.pieces||[]).filter(p=>+p.mi===i).reduce((s,p)=>s+(+p.w||0)*(+p.h||0)*(+p.c||0),0);
    const net=area,gross=area*(1+waste/100);
    const meters=(+x.w>0)?gross/(+x.w)/100:0;
    const qty=x.unit==='yd'?meters/YD:meters;
    return{n:x.n,unit:x.unit||'m',net,gross,meters,qty,cost:qty*(+x.p||0)};
  });
  const matCost=mats.reduce((s,x)=>s+x.cost,0);
  const hw=(m.hw||[]).reduce((s,x)=>s+(+x.q||0)*(+x.p||0),0);
  const lab=(m.labor||[]).reduce((s,x)=>s+(+x.a||0),0);
  const total=matCost+hw+lab,mg=Math.max(0,+m.margin||0);
  const price=total*(1+mg/100);
  return{mats,matCost,hw,lab,total,price,profit:price-total};
}

}

function words(n){
  n=Math.round(Math.abs(+n||0));if(!n)return'صفر';
  const U=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const T=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const H=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  const G=['',' هزار',' میلیون',' میلیارد',' تریلیون'];
  const three=x=>{const p=[];if(x>=100)p.push(H[Math.floor(x/100)]);x%=100;if(x>0){if(x<20)p.push(U[x]);else{p.push(T[Math.floor(x/10)]+(x%10?' و '+U[x%10]:''))}}return p.join(' و ')};
  const parts=[];let g=0;
  while(n>0&&g<G.length){const x=n%1000;if(x)parts.unshift(three(x)+G[g]);n=Math.floor(n/1000);g++}
  return parts.join(' و ');
}

async function doBackup(){
  if(!S.dl){toast('دریافت فایل در این نمایش در دسترس نیست');return}
  const bk=backupData(),total=COLS.reduce((s,c)=>s+S[c].length,0);

function parseBackup(txt){
  let o;try{o=JSON.parse(txt)}catch(e){return null}

  const data={};
  COLS.forEach(c=>{const a=o.data[c];data[c]=Array.isArray(a)?a.filter(x=>x&&typeof x.id==='string'&&x.id):[]});
  return{date:o.date,data};
}

}

const sumQ=a=>(a||[]).reduce((s,x)=>s+(+x.q||0),0);
function orderStats(o){
  const ordered=+o.qty||0,produced=sumQ(o.prod),invoiced=sumQ(o.inv);
  const tasks=(o.tasks||[]).filter(x=>nm(x.t)),needs=(o.needs||[]).filter(x=>nm(x.t));
  const cost=(o.costs||[]).reduce((s,x)=>s+(+x.a||0),0),price=+o.price||0,revenue=invoiced*price;
  return{ordered,produced,invoiced,tasks:tasks.length,tasksDone:tasks.filter(x=>x.d).length,needs:needs.length,needsDone:needs.filter(x=>x.d).length,cost,price,revenue,profit:revenue-cost};
}
function orderMatch(st){
  if(st.produced===st.invoiced)return st.produced>0?['good','تولید = فاکتور']:['neutral','شروع نشده'];
  const d=st.produced-st.invoiced;
  return d>0?['bad',faD(String(d))+' کیف تولیدشده فاکتور نشده']:['bad',faD(String(-d))+' کیف بیشتر از تولید فاکتور شده'];
}
const orderDone=st=>st.ordered>0&&st.produced>=st.ordered&&st.invoiced>=st.ordered;
function orderRow(o){
  const st=orderStats(o),m=orderMatch(st);

  if(a==='new-staff'){openStaffForm(b.dataset.t,null,b.dataset.id);return}
});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act="toggle-hide"]');if(!b)return;
  ui.hideNum=!ui.hideNum;try{localStorage.setItem('dk-hide',ui.hideNum?'1':'0')}catch(x){}
  render();
});
init();

})();
</script>
